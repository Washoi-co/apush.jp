<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A-PUSH 英会話</title>
<meta name="description" content="A-PUSH のスピーキング特化型英会話。法人・団体様、一般の方、学生さんに分けてご説明します。">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="deck.css">
<style>
.pick{max-width:1180px;margin:0 auto;padding:clamp(48px,8vw,120px) 16px}
.pick h1{margin:0 0 clamp(32px,5vw,64px);font-weight:900;font-size:clamp(28px,4vw,48px);line-height:1.3}
.pick ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2vw,24px)}
.pick a{display:flex;flex-direction:column;justify-content:flex-end;gap:12px;min-height:clamp(160px,22vw,280px);padding:clamp(24px,3vw,40px);background:var(--mist);text-decoration:none;font-weight:900;font-size:clamp(22px,2.4vw,32px);transition:background .22s,color .22s,transform .22s cubic-bezier(.2,1.5,.4,1)}
.pick a span{font-family:var(--en);font-size:14px;letter-spacing:.08em;color:var(--muted);transition:color .22s}
.pick a:hover{background:var(--ink-deep);color:var(--paper)}
.pick a:hover span{color:var(--muted-dark)}
.pick a:active{transform:scale(.97)}
.pick a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:767px){.pick ul{grid-template-columns:1fr}.pick a{min-height:120px}}
@media (prefers-reduced-motion:reduce){.pick a{transition:none}.pick a:active{transform:none}}
</style>
</head>
<body>
<header class="top"><a href="../"><img src="../assets/apush-logo.svg" alt="A-PUSH株式会社 トップへ" width="228" height="58"></a></header>
<main class="pick">
  <h1>話せるあなたに、コミット</h1>
  <ul>
    <li><a href="corporate.html"><span>FOR BUSINESS</span>法人・団体様</a></li>
    <li><a href="general.html"><span>FOR YOU</span>一般の方</a></li>
    <li><a href="students.html"><span>FOR STUDENTS</span>学生さん</a></li>
  </ul>
</main>
</body>
</html>
